# Lädt die Backend-Funktionen (supabase/functions) ins Supabase-Projekt hoch.
# Braucht das Repository-Secret SUPABASE_ACCESS_TOKEN (supabase.com > Account > Access Tokens).
# Die Datenbank-Migrationen werden nicht hier eingespielt (dafür bräuchte es das Datenbank-Passwort).
name: Backend hochladen

on:
  push:
    # feat/konto-abo nur, bis der Pull Request mit dem Backend gemergt ist
    branches: [main, feat/konto-abo]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/backend-deploy.yml']
  workflow_dispatch:

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: vyooyyidypadphxljqzn
    steps:
      - uses: actions/checkout@v4
      - name: Secret vorhanden?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Repository-Secret SUPABASE_ACCESS_TOKEN fehlt (siehe docs/backend.md)"
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Funktionen hochladen
        run: supabase functions deploy frage konto-loeschen revenuecat --project-ref "$PROJECT_REF" --use-api
